name: Build Windows packages

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Windows x64 installer and portable package
    runs-on: windows-2022
    timeout-minutes: 150

    env:
      OPENLP_REPOSITORY: https://gitlab.com/gideon-njoroge-group/openlp.git
      OPENLP_COMMIT: 0a5cda2435521cd085d9015a66e247160a1439d5
      PACKAGING_REPOSITORY: https://gitlab.com/openlp/packaging.git
      PACKAGING_COMMIT: d766d0c4e44b620b1bf59c3b02cc6e4af8953e2f
      PYTHON_VERSION: "3.12.8"

    steps:
      - name: Check out workflow repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify Windows runner
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Get-ComputerInfo | Select-Object WindowsProductName, WindowsVersion, OsArchitecture
          python --version
          git --version
          Get-PSDrive -Name C

      - name: Fetch pinned OpenLP source
        shell: pwsh
        env:
          OPENLP_GITLAB_USERNAME: ${{ secrets.OPENLP_GITLAB_USERNAME }}
          OPENLP_GITLAB_TOKEN: ${{ secrets.OPENLP_GITLAB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace($env:OPENLP_GITLAB_USERNAME) -or
              [string]::IsNullOrWhiteSpace($env:OPENLP_GITLAB_TOKEN)) {
            throw "Missing OPENLP_GITLAB_USERNAME or OPENLP_GITLAB_TOKEN Actions secret."
          }

          $askpass = Join-Path $env:RUNNER_TEMP "gitlab-askpass.cmd"
          $askpassContent = @'
          @echo off
          echo %~1 | findstr /i "Username" >nul
          if not errorlevel 1 (
            echo %OPENLP_GITLAB_USERNAME%
          ) else (
            echo %OPENLP_GITLAB_TOKEN%
          )
          '@
          Set-Content -Path $askpass -Value $askpassContent -Encoding ascii
          $env:GIT_ASKPASS = $askpass
          $env:GIT_TERMINAL_PROMPT = "0"

          $openlpDir = Join-Path $env:RUNNER_TEMP "openlp-source"
          git init $openlpDir
          if ($LASTEXITCODE -ne 0) { throw "git init failed" }
          git -C $openlpDir remote add origin $env:OPENLP_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw "git remote add failed" }
          git -C $openlpDir fetch --no-tags --depth=1 origin $env:OPENLP_COMMIT
          if ($LASTEXITCODE -ne 0) { throw "Fetching the pinned OpenLP source failed" }
          git -C $openlpDir checkout --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { throw "Checking out the pinned OpenLP source failed" }

          # The packaging builder calls git describe --tags to generate
          # OpenLP's version file. A depth-1 checkout without tags cannot do that.
          git -C $openlpDir fetch --unshallow --tags origin
          if ($LASTEXITCODE -ne 0) { throw "Fetching OpenLP history and tags failed" }
          $gitVersion = (git -C $openlpDir describe --tags).Trim()
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($gitVersion)) {
            throw "Unable to determine OpenLP version from repository tags."
          }
          Write-Host "OpenLP Git version: $gitVersion"

          $actual = (git -C $openlpDir rev-parse HEAD).Trim()
          if ($actual -ne $env:OPENLP_COMMIT) { throw "OpenLP source revision mismatch: $actual" }
          "OPENLP_DIR=$openlpDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "OpenLP source revision: $actual"
          Remove-Item Env:GIT_ASKPASS
          Remove-Item Env:GIT_TERMINAL_PROMPT
          Remove-Item $askpass -Force

      - name: Fetch pinned packaging source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $packagingDir = Join-Path $env:RUNNER_TEMP "openlp-packaging"
          git init $packagingDir
          if ($LASTEXITCODE -ne 0) { throw "Packaging git init failed" }
          git -C $packagingDir remote add origin $env:PACKAGING_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw "Packaging git remote add failed" }
          git -C $packagingDir fetch --no-tags --depth=1 origin $env:PACKAGING_COMMIT
          if ($LASTEXITCODE -ne 0) { throw "Fetching pinned packaging source failed" }
          git -C $packagingDir checkout --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { throw "Checking out packaging source failed" }
          $actual = (git -C $packagingDir rev-parse HEAD).Trim()
          if ($actual -ne $env:PACKAGING_COMMIT) { throw "Packaging revision mismatch: $actual" }
          $builder = Join-Path $packagingDir "builders/windows-builder.py"
          $config = Join-Path $packagingDir "windows/config-gitlab.ini"
          if (!(Test-Path $builder)) { throw "Pinned packaging revision has no builders/windows-builder.py" }
          if (!(Test-Path $config)) { throw "Pinned packaging revision has no windows/config-gitlab.ini" }
          "PACKAGING_DIR=$packagingDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "Packaging source revision: $actual"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: x64
          cache: pip
          cache-dependency-path: .github/workflows/build-windows.yml

      - name: Install Windows build dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install --upgrade pip
          python -m pip install sqlalchemy alembic platformdirs chardet beautifulsoup4 lxml Mako mysql-connector-python pytest mock websockets waitress six requests QtAwesome PySide6 QDarkStyle flask-cors pytest-qt pyenchant pysword qrcode flask packaging pymediainfo PyMuPDF python-vlc pyodbc pywin32
          $pyicuWheel = "https://github.com/cgohlke/pyicu-build/releases/download/v2.14/PyICU-2.14-cp312-cp312-win_amd64.whl"
          python -m pip install $pyicuWheel
          python -m pip install pyinstaller
          python -m pip check
          python --version
          python -m pip freeze | Out-File -FilePath "$env:RUNNER_TEMP\windows-python-packages.txt" -Encoding utf8

      - name: Install VLC and portable packaging tools
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          choco install vlc --no-progress --yes
          if ($LASTEXITCODE -ne 0) { throw "VLC installation failed" }
          $portableArchive = Join-Path $env:RUNNER_TEMP "portable-setup.7z"
          Invoke-WebRequest -Uri "https://get.openlp.org/win-sdk/portable-setup.7z" -OutFile $portableArchive
          if (!(Test-Path $portableArchive) -or (Get-Item $portableArchive).Length -lt 100000) {
            throw "Portable packaging support archive is missing or unexpectedly small."
          }
          # The pinned packaging config resolves PortableApps tools from
          # RUNNER_TEMP\PortableApps.comLauncher and RUNNER_TEMP\PortableApps.comInstaller.
          # Extract at RUNNER_TEMP (not in a nested portable-setup directory).
          7z x $portableArchive "-o$env:RUNNER_TEMP" -y
          if ($LASTEXITCODE -ne 0) { throw "Extracting portable packaging support failed" }

          $launcher = Join-Path $env:RUNNER_TEMP "PortableApps.comLauncher\PortableApps.comLauncherGenerator.exe"
          $installer = Join-Path $env:RUNNER_TEMP "PortableApps.comInstaller\PortableApps.comInstaller.exe"
          if (!(Test-Path $launcher)) { throw "PortableApps launcher generator not found at configured path: $launcher" }
          if (!(Test-Path $installer)) { throw "PortableApps installer not found at configured path: $installer" }
          Write-Host "PortableApps launcher: $launcher"
          Write-Host "PortableApps installer: $installer"
          Get-ChildItem "$env:RUNNER_TEMP\PortableApps.comLauncher","$env:RUNNER_TEMP\PortableApps.comInstaller" -Recurse -File |
            Select-Object FullName, Length

      - name: Build Windows installer and portable package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $builder = Join-Path $env:PACKAGING_DIR "builders/windows-builder.py"
          $config = Join-Path $env:PACKAGING_DIR "windows/config-gitlab.ini"
          Push-Location $env:PACKAGING_DIR
          try {
            python $builder --skip-update --config $config --branch $env:OPENLP_DIR --portable
            if ($LASTEXITCODE -ne 0) { throw "Windows packaging builder failed with exit code $LASTEXITCODE" }
          }
          finally {
            Pop-Location
          }

          $dist = Join-Path $env:OPENLP_DIR "dist"
          if (!(Test-Path $dist)) { throw "Expected build output directory does not exist: $dist" }
          Get-ChildItem $dist -Recurse -File | Select-Object FullName, Length
          $msi = @(Get-ChildItem $dist -File -Filter "*.msi")
          $exe = @(Get-ChildItem $dist -File -Filter "*.exe")
          if ($msi.Count -lt 1) { throw "The builder did not produce a Windows MSI installer." }
          if ($exe.Count -lt 1) { throw "The builder did not produce a Windows portable EXE." }

      - name: Validate packages and create checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dist = Join-Path $env:OPENLP_DIR "dist"
          $out = Join-Path $env:RUNNER_TEMP "windows-packages"
          New-Item -ItemType Directory -Path $out -Force | Out-Null

          $packages = @(
            Get-ChildItem $dist -File -Filter "*.msi"
            Get-ChildItem $dist -File -Filter "*.exe"
          )
          foreach ($package in $packages) {
            if ($package.Length -lt 1MB) { throw "Package is unexpectedly small: $($package.Name)" }
            $signature = Get-AuthenticodeSignature $package.FullName
            Write-Host "$($package.Name): $($package.Length) bytes; signature status=$($signature.Status)"
            Copy-Item $package.FullName $out
          }

          $msi = Get-ChildItem $out -File -Filter "*.msi" | Select-Object -First 1
          $extractDir = Join-Path $env:RUNNER_TEMP "msi-validation"
          New-Item -ItemType Directory -Path $extractDir -Force | Out-Null
          $log = Join-Path $env:RUNNER_TEMP "msi-admin-extract.log"
          $msiPathArg = '"' + $msi.FullName + '"'
          $targetArg = 'TARGETDIR="' + $extractDir + '"'
          $logArg = '/l*v "' + $log + '"'
          $process = Start-Process -FilePath "msiexec.exe" -ArgumentList "/a $msiPathArg /qn $targetArg $logArg" -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            Get-Content $log -Tail 100
            throw "MSI administrative extraction failed with exit code $($process.ExitCode)"
          }
          $appExe = Get-ChildItem $extractDir -Recurse -File -Filter "OpenLP.exe" | Select-Object -First 1
          if (!$appExe) { throw "OpenLP.exe was not found inside the extracted MSI." }
          Write-Host "MSI contains application executable: $($appExe.FullName)"

          $portable = Get-ChildItem $out -File -Filter "*.exe" | Select-Object -First 1
          Write-Host "Portable package: $($portable.Name)"
          $hashLines = foreach ($package in Get-ChildItem $out -File) {
            $hash = Get-FileHash $package.FullName -Algorithm SHA256
            "$($hash.Hash.ToLower())  $($package.Name)"
          }
          $hashLines | Set-Content (Join-Path $out "SHA256SUMS.txt") -Encoding ascii

          @(
            "Windows x64 package build"
            "OpenLP commit: $env:OPENLP_COMMIT"
            "Packaging commit: $env:PACKAGING_COMMIT"
            "Python: $(python --version)"
            "Target: Windows 10 and Windows 11 x64 (pending runtime smoke tests)"
            "Installer: $($msi.Name)"
            "Portable EXE: $($portable.Name)"
            "Signing: not configured"
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Inventory Authenticode signatures
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dist = Join-Path $env:OPENLP_DIR "dist"
          $extractDir = Join-Path $env:RUNNER_TEMP "msi-validation"
          $reportDir = Join-Path $env:RUNNER_TEMP "signature-inventory"
          New-Item -ItemType Directory -Path $reportDir -Force | Out-Null

          # Inspect the produced packages and every PE executable/library
          # extracted from the MSI. This step does not modify or sign files.
          $files = @(
            Get-ChildItem -Path $dist,$extractDir -Recurse -File |
              Where-Object { $_.Extension -in @(".exe", ".dll", ".msi") } |
              Sort-Object -Property FullName -Unique
          )
          if ($files.Count -eq 0) { throw "No MSI, EXE, or DLL files were found for signature inventory." }

          $inventory = foreach ($file in $files) {
            $signature = Get-AuthenticodeSignature -FilePath $file.FullName
            [PSCustomObject]@{
              File = $file.Name
              Extension = $file.Extension
              SizeBytes = $file.Length
              SignatureStatus = $signature.Status.ToString()
              SignerSubject = if ($signature.SignerCertificate) { $signature.SignerCertificate.Subject } else { "" }
              SignerThumbprint = if ($signature.SignerCertificate) { $signature.SignerCertificate.Thumbprint } else { "" }
              StatusMessage = $signature.StatusMessage
              Path = $file.FullName
            }
          }

          $csvPath = Join-Path $reportDir "authenticode-inventory.csv"
          $inventory | Export-Csv -Path $csvPath -NoTypeInformation -Encoding utf8
          $inventory | Group-Object SignatureStatus | Sort-Object Name |
            ForEach-Object { Write-Host ("{0}: {1} file(s)" -f $_.Name, $_.Count) }
          Write-Host "Inventory contains $($inventory.Count) MSI/EXE/DLL file(s)."
          Write-Host "Scope: MSI and PortableApps outer EXE in dist, plus EXE/DLL files extracted from the MSI."
          "Authenticode inventory: $($inventory.Count) files" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          $inventory | Group-Object SignatureStatus | Sort-Object Name |
            ForEach-Object { ("- {0}: {1}" -f $_.Name, $_.Count) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8 }

      - name: Upload signature inventory
        uses: actions/upload-artifact@v4
        with:
          name: openlp-windows-signature-inventory
          path: ${{ runner.temp }}/signature-inventory/authenticode-inventory.csv
          if-no-files-found: error
          retention-days: 30

      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: openlp-windows-x64-unsigned
          path: ${{ runner.temp }}/windows-packages/*
          if-no-files-found: error
          retention-days: 30

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: openlp-windows-build-diagnostics
          path: |
            ${{ runner.temp }}/windows-python-packages.txt
            ${{ runner.temp }}/msi-admin-extract.log
            ${{ runner.temp }}/openlp-packaging
            ${{ runner.temp }}/openlp-source
          if-no-files-found: ignore
          retention-days: 7
